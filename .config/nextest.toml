[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[[profile.default.overrides]]
filter = 'binary(nested_fullscreen) + binary(nested_sessions) + binary(nested_hardening) + binary(nested_guest_modal) + binary(nested_status_hints) + binary(startup_host_query) + (binary(sessions_live_view) & test(=a_nested_session_does_not_show_or_resize_the_pane_of_its_parent_that_runs_it))'
threads-required = 4

[[profile.default.overrides]]
filter = 'binary(render_cadence) & test(=a_redraw_split_across_pty_reads_is_never_shown_half_done)'
threads-required = "num-test-threads"
