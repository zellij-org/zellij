[package]
name = "zellij-integration-tests"
description = "In-process whole-app integration test harness for Zellij"
publish = false
license.workspace = true
repository.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
zellij-client = { path = "../zellij-client", version = "0.46.0" }
zellij-server = { path = "../zellij-server", version = "0.46.0" }
zellij-utils = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
interprocess = { workspace = true }
insta = "1.48"
log = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
futures-util = "0.3"
isahc = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = "0.28"
zellij-client = { path = "../zellij-client", version = "0.46.0", features = ["web_server_capability"] }
zellij-server = { path = "../zellij-server", version = "0.46.0", features = ["web_server_capability"] }
